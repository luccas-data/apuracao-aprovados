[project]
name = "apuracao-aprovados"
version = "0.1.0"
description = "Apuração de aprovados em residência médica: extração de PDFs e cruzamento de nomes com a base de alunos"
readme = "README.md"
authors = [
    { name = "Luccas Nunes", email = "342802132+luccas-data@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fpdf2>=2.8.9",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pdfplumber>=0.11.10",
    "rapidfuzz>=3.14.6",
    "seaborn>=0.13.2",
    "unidecode>=1.4.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
